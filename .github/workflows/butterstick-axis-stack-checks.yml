name: Check the minimal ButterStick clamp stack
on:
  push:
    branches: [analysis/butterstick-axis-stack-checks]
    paths: [.github/workflows/butterstick-axis-stack-checks.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install
      - run: bun run format:check
      - run: bunx tsc --noEmit
      - run: bun test --timeout 9999999
